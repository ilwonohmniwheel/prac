<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>전기기능사 실기 배선 실습</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#E6EAED; --surface:#FFFFFF; --paper:#F7F9F8; --grid:#E3E9E7;
  --ink:#1E2F3E; --ink-soft:#5A6A77; --line:#CBD3D9;
  --steel:#CDD3D8; --steel-edge:#98A3AC; --duct:#B9C2C9; --part:#F3F5F6; --part-edge:#5F6D78; --screw:#EDF0F2;
  --sel:#1C5FD4; --sel-bg:#E3ECFB;
  --ok:#2B8A4B; --ok-bg:#E2F3E7; --bad:#C9322A; --bad-bg:#FBE5E3;
  --w-R:#8A4B22; --w-S:#1A1A1A; --w-T:#8C949B; --w-PE:#2E9A4A; --w-ctrl:#E6B400; --w-ctrl-ink:#C39200;
  --halo:rgba(20,30,40,.45);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E141A; --surface:#161F27; --paper:#131C24; --grid:#1C2832;
    --ink:#DCE6EE; --ink-soft:#91A1AE; --line:#2A3743;
    --steel:#2A333C; --steel-edge:#3E4B56; --duct:#35414C; --part:#1D262E; --part-edge:#8A98A4; --screw:#2E3943;
    --sel:#6EA1FF; --sel-bg:#172A4A;
    --ok:#4CC074; --ok-bg:#14301E; --bad:#FF6B5E; --bad-bg:#3A1714;
    --w-S:#050505; --w-ctrl-ink:#E6B400; --halo:rgba(230,236,240,.6);
  }
}
:root[data-theme="dark"]{
  --bg:#0E141A; --surface:#161F27; --paper:#131C24; --grid:#1C2832;
  --ink:#DCE6EE; --ink-soft:#91A1AE; --line:#2A3743;
  --steel:#2A333C; --steel-edge:#3E4B56; --duct:#35414C; --part:#1D262E; --part-edge:#8A98A4; --screw:#2E3943;
  --sel:#6EA1FF; --sel-bg:#172A4A;
  --ok:#4CC074; --ok-bg:#14301E; --bad:#FF6B5E; --bad-bg:#3A1714;
  --w-S:#050505; --w-ctrl-ink:#E6B400; --halo:rgba(230,236,240,.6);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
.wrap{max-width:1560px;margin:0 auto;padding:20px 16px 40px}
.top h1{margin:0;font-size:26px;line-height:1.25;font-weight:700;letter-spacing:-.01em}
.top p{margin:4px 0 16px;color:var(--ink-soft);max-width:70ch}

.problem{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 18px;margin-bottom:14px}
.problem h2{margin:0;font-size:17px;font-weight:700}
.problem details{margin-top:6px}
.problem summary{cursor:pointer;color:var(--sel);font-weight:600;width:max-content}
.problem ul,.problem ol{margin:8px 0 4px;padding-left:22px;max-width:84ch}
.problem li{margin:2px 0}
.problem .ops{margin:8px 0 0;padding-left:22px;max-width:100ch;font-size:14px}
.problem .ops li{margin:3px 0}
.problem .note{margin:8px 0 0;font-size:13px;color:var(--ink-soft);max-width:100ch}

.probs{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.probs-cap{font-size:13px;font-weight:600;color:var(--ink-soft);min-width:128px}
.probs-list button:disabled{cursor:not-allowed;opacity:.45;border-style:dashed}
.probs-list{display:flex;gap:6px;flex-wrap:wrap}
.probs-list button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 12px;cursor:pointer;font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px}
.probs-list button .pn{display:inline-grid;place-items:center;min-width:24px;height:24px;border-radius:6px;background:var(--bg);font-size:13px}
.probs-list button[aria-current="true"]{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink) inset}
.probs-list button[aria-current="true"] .pn{background:var(--ink);color:var(--surface)}
.probs-list button .pt{font-weight:500;color:var(--ink-soft)}
.steps{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.steps button{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--surface);
  padding:10px 16px 10px 10px;border-radius:999px;cursor:pointer;font-weight:600}
.steps .n{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--ink);font-size:13px;font-weight:700}
.steps .cnt{font-weight:500;font-size:13px;color:var(--ink-soft)}
.steps button[aria-selected="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.steps button[aria-selected="true"] .n{border-color:var(--surface)}
.steps button[aria-selected="true"] .cnt{color:inherit;opacity:.75}
.steps button:focus-visible,.btn:focus-visible{outline:2px solid var(--sel);outline-offset:2px}

.work{display:grid;grid-template-columns:minmax(0,1.75fr) minmax(0,1fr);gap:14px;align-items:start}
.work.wire{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr)}
.work.big{grid-template-columns:1fr}
@media (max-width:1180px){.work{grid-template-columns:1fr}}
.pane{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;min-width:0}
.pane-bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.pane-bar h3{margin:0;font-size:15px;font-weight:700}
.tools{display:flex;gap:6px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);padding:6px 12px;border-radius:7px;cursor:pointer;font-size:14px;font-weight:500}
.btn:hover{border-color:var(--ink-soft)}
.btn.primary{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.scroll{overflow-x:auto;border-radius:6px;border:1px solid var(--line)}
#sch{display:block;width:100%;min-width:860px;height:auto;background:var(--paper)}
.status{margin:10px 2px 0;font-size:14px;color:var(--ink-soft);min-height:1.6em}
.status b{color:var(--ink)} .status .good{color:var(--ok);font-weight:600}

/* schematic */
#sch text{font-family:inherit}
#sch .sym line,#sch .sym path,#sch .sym rect,#sch .sym circle{stroke:var(--ink);stroke-width:1.5;fill:none}
#sch .sym .fillp{fill:var(--paper)}
#sch .sym .term{fill:var(--paper);stroke-width:1.2}
#sch .sym .dash{stroke-dasharray:4 3;stroke-width:1.1}
#sch .sym .lampYL{fill:rgba(230,180,0,.28)} #sch .sym .lampRL{fill:rgba(220,60,50,.2)} #sch .sym .lampGL{fill:rgba(40,160,80,.2)} #sch .sym .lampWL{fill:rgba(150,160,170,.18)}
#sch .ext{stroke:var(--ink-soft);stroke-width:1.4;fill:none;stroke-dasharray:3 2}
#sch .jn{fill:var(--ink)}
#sch .lbl{fill:var(--ink);font-size:12px;font-weight:600;stroke:none}
#sch .lbl.c{text-anchor:middle}
#sch .lbl.sm{font-size:10px}
#sch .tag{fill:var(--ink-soft);font-size:9.5px;font-weight:600}
.w .vis{stroke:var(--ink);stroke-width:1.5;fill:none;stroke-linejoin:round}
.w .hit{stroke:transparent;stroke-width:13;fill:none;stroke-linejoin:round}
.mode-pins .w{pointer-events:none}
.mode-free .w{pointer-events:none}
/* 4단계: 직접 배선 */
.fwrap{overflow:auto;border-radius:6px;border:1px solid var(--line);background:var(--paper);max-height:80vh;-webkit-overflow-scrolling:touch}
#fpanel{display:block;height:auto;touch-action:manipulation;user-select:none;-webkit-user-select:none}
#fpanel text{font-family:inherit}
.fpin{cursor:pointer}
.fpin .hitp{fill:transparent;stroke:none}
.fpin .sc{fill:var(--screw);stroke:var(--part-edge);stroke-width:.45}
.fpin:hover .sc{stroke:var(--sel);stroke-width:.9}
.fpin text{font-size:3.3px;font-weight:700;text-anchor:middle;fill:var(--ink);pointer-events:none}
.fpin.one .sc{fill:var(--sel-bg);stroke:var(--ink);stroke-width:.8}
.fpin.full .sc{fill:var(--ink-soft);stroke:var(--ink);stroke-width:.8}
.fpin.full text{fill:var(--surface)}
.fpin.full{cursor:not-allowed}
.fpin.hl .sc{fill:var(--sel-bg);stroke:var(--sel);stroke-width:1}
.fpin.over .sc{stroke:var(--bad);stroke-width:1.2}
.fpin.pick .sc{fill:var(--sel);stroke:var(--sel)}
.fpin.pick text{fill:#fff}
.fpin .ring{fill:none;stroke:var(--sel);stroke-width:.8}
.fpin.pick .ring{animation:fpulse .9s ease-in-out infinite alternate}
.fpin .miss{fill:none;stroke:var(--bad);stroke-width:.8;stroke-dasharray:1.2 1}
@keyframes fpulse{from{opacity:1}to{opacity:.25}}
.pw.bad .halo{stroke:var(--bad)}
.pw.good .halo{stroke:var(--ok)}
.ghost{fill:none;stroke:var(--sel);stroke-width:.7;stroke-dasharray:2.2 1.6;opacity:.8;pointer-events:none}
.palette{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
.palette button{display:flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px 5px 6px;cursor:pointer;font-size:13px;font-weight:600}
.palette button i{width:18px;height:18px;border-radius:50%;box-shadow:0 0 0 1px var(--halo)}
.palette button i.pe{background:repeating-linear-gradient(45deg,var(--w-PE) 0 4px,#E8C800 4px 7px)!important}
.palette button[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 1.5px var(--ink) inset}
.palette-cap{font-size:13px;color:var(--ink-soft);margin:0 0 6px}
.btn[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink) inset}
.btn:disabled{opacity:.45;cursor:not-allowed}
.fres .score{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:2px}
.fres .score b{font-size:32px;line-height:1.1}
.fres .score span{font-size:14px;color:var(--ink-soft)}
.fres .verdict{font-size:14px;margin:4px 0 8px}
.fres .verdict.ok{color:var(--ok);font-weight:600}
.fres .verdict.no{color:var(--bad);font-weight:600}
.nlist{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:5px}
.nlist button{width:100%;text-align:left;display:grid;grid-template-columns:62px 1fr;align-items:start;gap:8px;border:1px solid var(--line);border-radius:7px;background:var(--surface);padding:7px 10px;cursor:pointer;font-size:13px;line-height:1.45}
.nlist button:hover{border-color:var(--ink-soft)}
.nlist button.sel{border-color:var(--sel);box-shadow:0 0 0 1px var(--sel) inset}
.nlist .st{font-weight:700;font-size:12px;border-radius:5px;padding:1px 0;text-align:center}
.nlist .st.ok{background:var(--ok-bg);color:var(--ok)}
.nlist .st.bad{background:var(--bad-bg);color:var(--bad)}
.nlist .why{display:block;color:var(--ink-soft);font-size:12.5px;margin-top:2px}
.nlist.oks{opacity:.85}
.fres details summary{cursor:pointer;color:var(--sel);font-weight:600;font-size:13px;margin-top:10px}
.zoomer{display:flex;gap:4px;align-items:center;font-size:12.5px;color:var(--ink-soft)}
.zoomer .btn{padding:4px 10px}
.zoomer .btn{white-space:nowrap}
.quick{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 10px;font-size:13px;color:var(--ink-soft)}
.quick .btn{font-weight:600}
.tbpick .cell.unset{background:var(--paper);border-style:dashed}
.tbpick .cell.unset small{font-size:11px}
.tbpick .cell.editing{border-color:var(--sel);box-shadow:0 0 0 2px var(--sel) inset}
#tbpop{position:fixed;z-index:60;width:min(380px,calc(100vw - 16px));max-height:min(70vh,460px);display:flex;flex-direction:column;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 32px rgba(10,20,30,.28);padding:10px 12px 12px}
#tbpop[hidden]{display:none}
#tbpop p{margin:2px 0 6px;font-size:12.5px;color:var(--ink-soft);line-height:1.45}
#tbpop .tbfs{overflow:auto;min-height:0;margin-top:2px;padding:1px}
.tbpop-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.tbpop-head h4{margin:0;font-size:15px}
.tbpop-x{border:none;background:none;font-size:22px;line-height:1;cursor:pointer;color:var(--ink-soft);padding:2px 6px;border-radius:6px}
.tbpop-x:hover{background:var(--bg);color:var(--ink)}
.tbpop-foot{display:flex;gap:6px;margin-top:8px}
#cfm{position:fixed;z-index:70;width:min(340px,calc(100vw - 16px));background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 32px rgba(10,20,30,.3);padding:12px 14px}
#cfm[hidden]{display:none}
#cfm p{margin:0 0 10px;font-size:14px;line-height:1.5}
.cfm-row{display:flex;justify-content:flex-end;gap:6px}
.btn kbd{font:600 11px/1 inherit;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:2px 4px;margin-left:4px;color:var(--ink-soft);background:var(--paper)}
@media (hover:none){.btn kbd{display:none}}
.tbtools{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 6px}
.tbcard{border-left:4px solid var(--sel)}
.tbans-bar{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 10px}
.tbans{margin-top:-2px}
.tbpick .cell.ro{cursor:default}
.tbpick .cell.ro.match{background:var(--ok-bg);border-color:var(--ok)}
.tbpick .cell.ro.diff{border-color:var(--bad);box-shadow:0 0 0 1px var(--bad) inset}
.tbfs{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:5px;margin-top:6px}
.tbfs button{display:flex;flex-direction:column;align-items:flex-start;gap:1px;text-align:left;border:1px solid var(--line);border-radius:6px;background:var(--surface);padding:6px 8px;cursor:pointer;font-size:13px;line-height:1.3}
.tbfs button small{font-size:11.5px;color:var(--ink-soft)}
.tbfs button:hover{border-color:var(--sel)}
.tbfs button.on{background:var(--sel);color:#fff;border-color:var(--sel)} .tbfs button.on small{color:#fff}
.tbfs button.used{opacity:.55}
.tbedit{fill:var(--sel-bg);stroke:var(--sel);stroke-width:.8}
.tbnum{opacity:.55}
.fpin.unset .sc{fill:var(--paper);stroke-dasharray:.8 .6}

/* 3단계: 배관·단자대 */
#layWrap{max-height:82vh}
#lay.mode-ext{min-width:0}
.xpin{cursor:pointer}
.xpin .hitp{fill:transparent}
.xpin .sc{fill:var(--screw);stroke:var(--ink);stroke-width:1.4}
.xpin:hover .sc{stroke:var(--sel);stroke-width:2.2}
.xpin.one .sc{fill:var(--sel-bg)}
.xpin.full .sc{fill:var(--ink-soft)}
.xpin.full{cursor:not-allowed}
.xpin.over .sc{stroke:var(--bad);stroke-width:2.4}
.xpin.hl .sc{fill:var(--sel-bg);stroke:var(--sel);stroke-width:2.4}
.xpin.pick .sc{fill:var(--sel);stroke:var(--sel)}
.xpin .ring{fill:none;stroke:var(--sel);stroke-width:2;animation:fpulse .9s ease-in-out infinite alternate}
.xpin .miss{fill:none;stroke:var(--bad);stroke-width:2;stroke-dasharray:3 2}
.uw{cursor:pointer}
.uw .h{fill:none;stroke:var(--halo);stroke-width:4.4;stroke-linejoin:round;opacity:.5}
.uw .lw{fill:none;stroke-width:2.6;stroke-linejoin:round;stroke-linecap:round}
.uw .lw.t-R{stroke:var(--w-R)} .uw .lw.t-S{stroke:var(--w-S)} .uw .lw.t-T{stroke:var(--w-T)} .uw .lw.t-PE{stroke:var(--w-PE)} .uw .lw.t-ctrl{stroke:var(--w-ctrl)}
.uw .pes{fill:none;stroke:#E8C800;stroke-width:1.4;stroke-dasharray:5 5}
.uw .hit{fill:none;stroke:transparent;stroke-width:10}
.uw.sel .h{stroke:var(--sel);stroke-width:7;opacity:1}
.uw.bad .h{stroke:var(--bad);stroke-width:7;opacity:.9}
.uw.fresh .lw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1s ease-out forwards}
.xghost{fill:none;stroke:var(--sel);stroke-width:2;stroke-dasharray:8 6;opacity:.75;pointer-events:none}
.cond.xbad .tube{stroke:var(--bad)}
.cnt2.okc{color:var(--ok);font-weight:700} .cnt2.badc{color:var(--bad);font-weight:700}
.tbpick{display:grid;grid-template-columns:34px 1fr;align-items:center;gap:6px;margin-bottom:6px}
.tbpick .tbn{font-size:12px;font-weight:700;color:var(--ink-soft)}
.tbpick .cells{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:3px}
.tbpick .cell{min-height:38px;border:1px solid var(--line);border-radius:5px;background:var(--surface);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2px 0;font-size:11px;line-height:1.15}
.tbpick .cell b{font-weight:700} .tbpick .cell small{font-size:10px;color:var(--ink-soft)}
.tbpick .cell.off{background:var(--bg);border-style:dashed;opacity:.5;cursor:default}
.tbpick .cell.one{background:var(--sel-bg)}
.tbpick .cell.full{background:var(--ink-soft);color:var(--surface);cursor:not-allowed} .tbpick .cell.full small{color:inherit}
.tbpick .cell.pick{background:var(--sel);color:#fff;border-color:var(--sel)} .tbpick .cell.pick small{color:#fff}
.tbpick .cell:not(.off):hover{border-color:var(--sel)}
@media (prefers-reduced-motion:reduce){.uw.fresh .lw{animation:none;stroke-dashoffset:0}.xpin .ring,.fpin.pick .ring{animation:none}}
@media (max-width:1180px){.work.wire{grid-template-columns:1fr}.zoomer [data-act="big"]{display:none}}
.mode-wire .w{cursor:pointer}
.mode-wire .w:hover .vis{stroke:var(--sel);stroke-width:3}
.w.on .vis{stroke-width:3}
.w.on.t-R .vis{stroke:var(--w-R)} .w.on.t-S .vis{stroke:var(--w-S)} .w.on.t-T .vis{stroke:var(--w-T)}
.w.on.t-PE .vis{stroke:var(--w-PE)} .w.on.t-ctrl .vis{stroke:var(--w-ctrl-ink)}
.w.hint .vis{stroke:var(--sel);stroke-width:3;stroke-dasharray:7 5;animation:march .8s linear infinite}
.w.sel .vis{stroke:var(--sel);stroke-width:4.2;stroke-dasharray:none}
@keyframes march{to{stroke-dashoffset:-12}}
.slot{cursor:pointer;outline:none}
.slot rect{fill:var(--surface);stroke:var(--ink-soft);stroke-width:1.1;stroke-dasharray:3 2}
.slot text{font-size:11px;font-weight:700;text-anchor:middle;fill:var(--ink)}
.slot:hover rect,.slot:focus-visible rect{stroke:var(--sel);stroke-dasharray:none;stroke-width:1.8}
.slot.active rect{stroke:var(--sel);stroke-width:2.2;fill:var(--sel-bg);stroke-dasharray:none}
.slot.ok rect{fill:var(--ok-bg);stroke:var(--ok);stroke-dasharray:none} .slot.ok text{fill:var(--ok)}
.slot.bad rect{fill:var(--bad-bg);stroke:var(--bad);stroke-dasharray:none} .slot.bad text{fill:var(--bad)}
.pinlbl{font-size:10.5px;font-weight:700;fill:#D0306A;text-anchor:middle}

/* side cards */
.card{border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin-bottom:12px;background:var(--surface)}
.card h4{margin:0 0 4px;font-size:15px}
.card p{margin:4px 0;font-size:14px;max-width:66ch}
.card .warn{color:var(--bad);font-weight:600}
.card.now{border-left:4px solid var(--sel)}
.refs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:520px){.refs{grid-template-columns:1fr}}
.ref{border:1px solid var(--line);border-radius:8px;padding:10px 10px 8px}
.ref.active{border-color:var(--sel);box-shadow:0 0 0 1px var(--sel) inset}
.ref header{display:flex;justify-content:space-between;align-items:baseline;gap:6px;margin-bottom:6px}
.ref h4{margin:0;font-size:14px} .ref header span{font-size:12px;color:var(--ink-soft)}
.sock{width:100%;height:auto;display:block;margin:2px 0 6px;color:var(--ink)}
.sock text{font-family:inherit}
.sock .base{fill:var(--part);stroke:var(--part-edge);stroke-width:1.6}
.sock .hole{fill:var(--paper);stroke:var(--part-edge);stroke-width:1.4}
.sock .frame{fill:none;stroke:var(--part-edge);stroke-width:1.2}
.sock .pn circle{fill:var(--surface);stroke:var(--ink);stroke-width:1.4}
.sock .pn text{font-size:12px;font-weight:700;text-anchor:middle;fill:var(--ink)}
.sock .pn.hl circle{fill:var(--sel);stroke:var(--sel)}
.sock .pn.hl text{fill:#fff}

const L=(x1,y1,x2,y2,c)=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"${c?` class="${c}"`:''}/>`;

/* 한시 접점 표시: 가동 접점(블레이드)에 밑변을 붙인 삼각형 */
function triMark(ax,ay,bx,by,sx,sy,k=1){
  const dx=bx-ax, dy=by-ay, len=Math.hypot(dx,dy), ux=dx/len, uy=dy/len;
  let nx=-uy, ny=ux; if(nx*sx+ny*sy<0){ nx=-nx; ny=-ny; }
  const mx=ax+dx*.55, my=ay+dy*.55, h=5*k, t=9*k;
  const f=v=>v.toFixed(1);
  return `<path d="M${f(mx-ux*h)} ${f(my-uy*h)} L${f(mx+ux*h)} ${f(my+uy*h)} L${f(mx+nx*t)} ${f(my+ny*t)} Z"/>`;
}
/* 제어회로 접점: 공개문제 도면 방식 (단자 o o + 막대. a: 오른쪽에 떨어진 막대 / b: 왼쪽에 닿은 막대) */
function contact(x,y1,y2,type,o={}){
  const st=Math.min(10,(y2-y1)/4), t1=y1+st, t2=y2-st, my=(t1+t2)/2, isA=type==='a';
  const bx = isA ? x+7 : x-3.3, out = isA ? 1 : -1;
  let s=L(x,y1,x,t1)+L(x,t2,x,y2)+L(bx,t1-4,bx,t2+4);
  if(o.pb) s+=L(bx,my,bx+8*out,my);
  if(o.timer) s+=`<path d="M${bx} ${my-6} L${bx+9*out} ${my} L${bx} ${my+6}"/>`;
  if(o.flicker) s+=`<path d="M${bx-8} ${my} L${bx} ${my-3.6} L${bx+8} ${my} L${bx} ${my+3.6} Z" style="fill:var(--ink)"/>`;
  if(o.eocr) s+=L(bx-5,my-5,bx+5,my+5)+L(bx-5,my+5,bx+5,my-5);
  s+=term(x,t1)+term(x,t2);
  if(o.label) s+=T_(x+(o.lx||15),my+5,o.label);
  return s;
}

      <div class="legend"><span><i style="background:var(--w-R)"></i>L1</span><span><i style="background:var(--w-S)"></i>L2</span><span><i style="background:var(--w-T)"></i>L3</span><span><i style="background:var(--w-PE)"></i>PE</span><span><i style="background:var(--w-ctrl)"></i>제어</span>

    <div class="panelwrap"><svg id="panel" viewBox="-6 -6 412 432" class="${sel.wire?'has-sel':''}" role="img" aria-label="제어함 배선 상태">${panelSVG()}</svg></div>
    <div class="card info" style="margin-top:12px">${info}</div>${rules}`;
}

/* ================= 렌더링: 3단계 배관 ================= */
function renderLayout(){
  let o=LAY_STATIC, tubes='', wires='', hits='';
  DUCTS.forEach(d=>{
    const m=d.wires.length, wd=m*5+(d.no===3?6:12);
    let c=`cond n${d.no}`; if(sel.duct===d.id) c+=' sel'; if(sel.dhint===d.id) c+=' hint';
    const pd=polyD(d.pts);
    let g=`<path class="tube" d="${pd}" stroke-width="${wd}"/>`;
    if(d.no===2) g+=`<path class="rib" d="${pd}" stroke-width="${wd}"/>`;
    g+=`<path class="inner" d="${pd}" stroke-width="${wd-(d.no===3?4:8)}"/>`+slashes(d);
    tubes+=`<g class="${c}">${g}</g>`;
    hits+=`<g class="cond" data-duct="${d.id}"><path class="hitd" d="${pd}"/></g>`;
  });
  EXT_SEGS.forEach(segs=>segs.forEach(sg=>{ if(!ducted.has(sg.cid)) return;
    const c=`lw t-${sg.type}${sel.duct===sg.cid?' sel':''}${sel.dfresh===sg.cid?' fresh':''}`;
    wires+=`<path class="${c}" d="${polyD(sg.pts)}" pathLength="1"/>`; }));
  JUMPS.forEach(j=>{ if(ducted.has(j.duct)) wires+=`<path class="lw t-ctrl${sel.duct===j.duct?' sel':''}${sel.dfresh===j.duct?' fresh':''}" d="${polyD(j.pts)}" pathLength="1"/>`; });
  // 단자 나사는 전선 위에 다시 그려 실제 체결처럼 보이게
  let screws='';
  EXTW.forEach(w=>{ const segs=EXT_SEGS[EXTW.indexOf(w)]; if(!ducted.has(segs[0].cid) && !ducted.has(segs[segs.length-1].cid)) return;
    [w[0],w[1]].forEach(id=>{ const [x,y]=LT[id]; screws+=`<circle class="lscr on" cx="${x}" cy="${y}" r="${id.startsWith('TB5')||id.startsWith('TB6')?4:5.5}"/>`; }); });
  $('#lay').innerHTML=o+tubes+`<g class="wires">${wires}</g>`+screws+hits;
}
function renderSideDuct(){
  const list=DUCTS.map(d=>`<li><button data-duct="${d.id}" class="${sel.duct===d.id?'sel':''}"><span class="no">${circ(d.no)}</span><span>${d.from} → ${d.to}</span><span class="cnt2">${d.wires.length}가닥${ducted.has(d.id)?' <span class="done">✓</span>':''}</span></button></li>`).join('');
  let info;
  if(sel.duct){
    const d=DUCTS.find(x=>x.id===sel.duct);
    info=`<h4>${d.from} → ${d.to}</h4><span class="chip">${circ(d.no)} ${DUCT_NAME[d.no]}</span><span class="chip">${d.wires.length}가닥 (도면 빗금 ${d.wires.length}개)</span><p>${d.note}</p>
      <table class="wtab"><tbody>${d.wires.map(w=>`<tr><td><i style="background:var(--w-${w[2]})"></i></td><td>${w[0]}</td><td>→</td><td>${w[1]}</td></tr>`).join('')}</tbody></table>
      <div class="row">${ducted.has(d.id)?`<button class="btn" data-act="unduct">이 배관 선 빼기</button>`:`<button class="btn primary" data-act="ductit">입선하기</button>`}</div>`;
  } else if(sel.dhint){
    const d=DUCTS.find(x=>x.id===sel.dhint);
    info=`<h4>다음 배관: ${d.from} → ${d.to}</h4><p>배치도에서 깜빡이는 관을 눌러 전선을 넣으세요.</p>`;
  } else info=`<h4>배치도의 관을 눌러 보세요</h4><p>누른 관에 어떤 전선이 몇 가닥 들어가는지, 제어함의 어느 단자에서 어느 기구로 가는지 보여 줍니다.</p>`;
  $('#side').innerHTML=`<div class="pane-bar"><h3>배관 목록</h3><div class="legend"><span><i style="background:#7C858D"></i>① PE 전선관</span><span><i style="background:#9AA3AB"></i>② 플렉시블</span><span><i style="background:#30363B"></i>③ 케이블</span></div></div>
    <ul class="dlist">${list}</ul><div class="card info">${info}</div>
    <div class="card rules"><h4 style="color:var(--ink)">입선할 때 지킬 점</h4><ul>
      <li><b>가닥 수 확인</b>: 관마다 넣는 전선 수가 도면의 빗금(/) 수와 같아야 합니다.</li>
      <li><b>관 안에서 접속 금지</b>: 전선은 관 안에서 잇지 않고, 단자에서만 연결합니다.</li>
      <li><b>공통선 활용</b>: 램프·부저처럼 공통 L2를 쓰는 기구는 함 안에서 묶어 가닥 수를 줄입니다.</li>
      <li><b>외부 기구는 단자대 경유</b>: 모든 외부 전선은 제어함의 TB5·TB6에서 시작합니다.</li></ul></div>`;
}

/* ================= 공통 렌더링 ================= */
function render(){
  ST=computeStatus();
  const filled=EL_IDS.reduce((n,id)=>n+(state.pins[id]||[]).filter(v=>v!=null).length,0);
  const okSlots=EL_IDS.filter(id=>ST[id]==='ok').reduce((n,id)=>n+EL[id].ans.length,0);
  document.querySelectorAll('.steps button').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.mode===state.mode)));
  const wl=state.mode==='free'||state.mode==='ext'; $('#work').classList.toggle('big', wl && !!state.big); $('#work').classList.toggle('wire', wl);
  $('#cnt-free').textContent=FRES?`${FRES.score}점`:`${state.free.length}가닥`;
  $('#cnt-pins').textContent=state.checked?`${okSlots}/${TOTAL_SLOTS} 정답`:`${filled}/${TOTAL_SLOTS}`;
  $('#cnt-ext').textContent=XRES?`${XRES.score}점`:`${state.ext.length}가닥`;
  $('#schWrap').hidden=state.mode==='ext'; $('#layWrap').hidden=state.mode!=='ext';
  $('#leftTitle').textContent=state.mode==='ext'?'배관 및 기구 배치도':state.mode==='free'?'시퀀스 도면 (참고)':'시퀀스 도면';
  const tools=$('#tools'), st=$('#status');
  if (state.mode==='free'){ renderFree(tools,st); }
  else if (state.mode==='ext'){ renderExt(tools,st); }
  else if (state.mode==='pins'){
    tools.innerHTML=`<button class="btn primary" data-act="check">채점하기</button><button class="btn" data-act="answer">정답 채우기</button><button class="btn" data-act="clearpins">모두 지우기</button>`;
    st.innerHTML=state.checked
      ? (okSlots===TOTAL_SLOTS?`<span class="good">${TOTAL_SLOTS}칸 모두 맞았어요.</span> 이제 2단계에서 제어판을 배선해 보세요.`:`<b>${okSlots}/${TOTAL_SLOTS}칸 정답.</b> 빨간 칸을 눌러 무엇이 틀렸는지 확인하세요.`)
      : `칸을 채운 뒤 채점하기를 누르세요. 입력 <b>${filled}/${TOTAL_SLOTS}</b>칸`;
    renderSchematic(); renderSidePins();
  } else if (state.mode==='duct'){
    tools.innerHTML=`<button class="btn primary" data-act="dnext">다음 배관 보기</button><button class="btn" data-act="dall">모두 입선</button><button class="btn" data-act="dclear">초기화</button>`;
    const n=DUCTS.filter(d=>ducted.has(d.id)).reduce((a,d)=>a+d.wires.length,0);
    st.innerHTML=ducted.size===DUCTS.length?`<span class="good">입선 완료.</span> 배관 ${DUCTS.length}개에 ${DUCT_WIRES}가닥을 모두 넣었어요.`:`배관 <b>${ducted.size}/${DUCTS.length}</b>개 입선, <b>${n}/${DUCT_WIRES}</b>가닥`;
    renderLayout(); renderSideDuct();
  } else {
    tools.innerHTML=`<button class="btn primary" data-act="next">다음 선 보기</button><button class="btn" data-act="wireall">모두 연결</button><button class="btn" data-act="clearwires">초기화</button>`;
    const mainN=WIRES.filter(w=>w.type!=='ctrl').length, mainD=WIRES.filter(w=>w.type!=='ctrl'&&wired.has(w.id)).length;
    st.innerHTML=wired.size===WIRES.length
      ? `<span class="good">배선 완료.</span> ${WIRES.length}가닥을 모두 연결했어요. 선을 눌러 경로를 다시 확인해 보세요.`
      : `<b>${wired.size}/${WIRES.length}</b>가닥 연결됨. 주회로·접지 ${mainD}/${mainN}, 제어회로 ${wired.size-mainD}/${WIRES.length-mainN}`;
    renderSchematic(); renderSideWire();
  }
  save(); sel.fresh=null; sel.dfresh=null;
  if(typeof tbPopRender==='function') tbPopRender();
}

const kp=$('#keypad');
function openKeypad(id,i){
  sel.slot={id,i}; render();

  const e=EL[id], max=COMP_MAX[e.comp], cur=(state.pins[id]||[])[i];
  kp.innerHTML=`<div class="kp-head">${e.name}<span>${i+1}/${e.ans.length}번째</span></div>
    <div class="kp-grid">${Array.from({length:max},(_,k)=>`<button data-n="${k+1}"${cur===k+1?' style="border-color:var(--sel)"':''}>${k+1}</button>`).join('')}</div>
    <div class="kp-foot"><button data-n="clear">비우기</button><button data-n="close">닫기</button></div>`;
  kp.hidden=false;
  if (g){ const r=g.getBoundingClientRect(), w=kp.offsetWidth, h=kp.offsetHeight;
    let left=r.left+r.width/2-w/2, top=r.bottom+8; if(top+h>innerHeight-8) top=r.top-h-8;
    kp.style.left=Math.max(8,Math.min(left,innerWidth-w-8))+'px'; kp.style.top=Math.max(8,top)+'px'; }
  (kp.querySelector('.kp-grid button')||kp).focus({preventScroll:true});
}
const closeKeypad=()=>{ kp.hidden=true; };
kp.addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b||!sel.slot) return;
  const {id,i}=sel.slot, n=b.dataset.n;
  if (n==='close'){ closeKeypad(); return; }
  const arr=state.pins[id]=(state.pins[id]||[]).slice(); while(arr.length<EL[id].ans.length) arr.push(null);
  if (n==='clear'){ arr[i]=null; closeKeypad(); render(); return; }
  arr[i]=+n;
  const next=arr.findIndex((v,k)=>k>i && v==null);
  if (next>=0) openKeypad(id,next);

});

/* ================= 단자대 용도: 학습자가 직접 정함 ================= */
const TBN=20;
const TBFUNC=[];
[['TB5',TB5],['TB6',TB6]].forEach(([s,arr])=>arr.forEach(c=>{ if(c) TBFUNC.push({id:s+'-'+c[2],name:c[0],sub:c[1]||''}); }));
const TBF=Object.fromEntries(TBFUNC.map(f=>[f.id,f]));
TBFUNC.forEach(f=>{ const w=EXTW.find(w=>w[0]===f.id); f.to=w?`${w[1].split('-')[0]} ${LT[w[1]][2]}`:'제어함 안'; });
const fLabel=f=>`${f.name}${f.sub?' '+f.sub:''}`;
const isTBf=id=>/^TB[56]-/.test(id);
['TB5','TB6'].forEach(s=>{ for(let i=0;i<TBN;i++){
  PIN[`${s}#${i+1}`]={x:TBX+CELL*(i+.5),y:s==='TB5'?59:361,ch:s==='TB5'?'top':'bot',label:'',t:'',phys:true};
  LT[`${s}#${i+1}`]=[PX0+73+12.7*(i+.5),s==='TB5'?492:828,''];
}});
TBFUNC.forEach(f=>{ PIN[f.id].label=`단자대 ${fLabel(f)}`; });
if(!state.tbmap||typeof state.tbmap!=='object') state.tbmap={};
Object.keys(state.tbmap).forEach(k=>{ if(!PIN[k]||!TBF[state.tbmap[k]]) delete state.tbmap[k]; });
const cellOf=fid=>Object.keys(state.tbmap).find(k=>state.tbmap[k]===fid)||null;
const cellName=id=>id.replace('#',' ')+'번';
const cellLabel=id=>{ const f=TBF[state.tbmap[id]]; return `${cellName(id)}${f?` (${fLabel(f)})`:''}`; };
const tbSel={cell:null,showAns:false,anchor:null};
/* 모범 답안 단자대 배치 (도면 기준) */
const TB_ANS={};
[['TB5',TB5],['TB6',TB6]].forEach(([s,arr])=>arr.forEach((c,i)=>{ if(c) TB_ANS[`${s}#${i+1}`]=s+'-'+c[2]; }));
function tbAnsHTML(){
  const bar=`<div class="tbans-bar"><button class="btn" data-act="tbans" aria-pressed="${tbSel.showAns}">모범 답안 단자대 보기</button><button class="btn" data-act="tbfill">모범 답안으로 채우기</button></div>`;

}

  if(e.target.closest('#tbpop,[data-tbcell],#fpanel [data-pin],#lay [data-xp]')) return;
  tbSel.cell=null; render();
});
document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&!tbPop.hidden){ tbSel.cell=null; render(); } });
document.addEventListener('scroll',()=>requestAnimationFrame(tbPopPos),true);
window.addEventListener('resize',()=>requestAnimationFrame(tbPopPos));
function tbSideClick(e){
  const c=e.target.closest('[data-tbcell]'); if(c){ const id=c.dataset.tbcell; if(tbSel.cell===id) tbSel.cell=null; else tbOpen(id); render(); return true; }
  const f=e.target.closest('[data-tbf]'); if(f&&tbSel.cell){ tbAssign(tbSel.cell,f.dataset.tbf); tbSel.cell=null; freeSel.msg=''; extSel.msg=''; render(); return true; }
  const b=e.target.closest('[data-act]'); const a=b&&b.dataset.act;
  if(a==='tbans'){ tbSel.showAns=!tbSel.showAns; render(); return true; }
  if(a==='tbfill'){
    const n=Object.keys(state.tbmap).length, wired=state.free.length+state.ext.length;
    const go=()=>{ tbPush(); state.tbmap={...TB_ANS}; tbSel.cell=null; FRES=null; XRES=null; freeSel.msg=''; extSel.msg=''; render(); };
    if(n||wired) ask(`지금 정한 단자대 용도${n?` ${n}개`:''}를 모범 답안 배치로 바꿀까요?${wired?' 이미 연결한 선은 같은 칸에 그대로 남고, 칸의 용도만 바뀌어요.':''}`,'바꾸기',go,b); else go();
    return true; }
  if(a==='tbundo'){ if(tbHist.length){ state.tbmap=JSON.parse(tbHist.pop()); tbSel.cell=null; FRES=null; XRES=null; } render(); return true; }
  if(a==='tbreset'){
    const wired=state.free.length+state.ext.length;
    if(!Object.keys(state.tbmap).length) return true;
    ask(`정한 단자대 용도 ${Object.keys(state.tbmap).length}개를 모두 지울까요?${wired?' 연결한 선은 남지만, 용도가 없는 단자에 물린 선은 채점에서 틀린 연결이 돼요.':''} 지운 뒤에도 "용도 되돌리기"로 되살릴 수 있어요.`,'모두 비우기',()=>{ tbPush(); state.tbmap={}; tbSel.cell=null; FRES=null; XRES=null; render(); },b);
    return true; }
  if(a==='tbclear'&&tbSel.cell){ tbAssign(tbSel.cell,null); tbSel.cell=null; render(); return true; }
  if(a==='tbclose'){ tbSel.cell=null; render(); return true; }
  return false;
}
/* 단자대 위치가 배관과 맞는지 (2단계 채점에서 미리 알려 줌) */
function tbSideIssues(){
  return TBFUNC.map(f=>{ const cell=cellOf(f.id); if(!cell) return null; const w=EXTW.find(w=>w[0]===f.id); if(!w) return null;
    const side=cell.slice(0,3), g=GNODE[XGROUP[w[1]]];
    return g&&!ductPath(XNODE[side],g)?{f,cell,side}:null; }).filter(Boolean);
}
/* 선택한 선을 Delete·Backspace 키로 빼기 */
document.addEventListener('keydown',e=>{
  if(e.key!=='Delete'&&e.key!=='Backspace') return;
  if(e.ctrlKey||e.metaKey||e.altKey) return;
  const t=document.activeElement; if(t&&(/INPUT|TEXTAREA|SELECT/.test(t.tagName)||t.isContentEditable)) return;
  if(!cfm.hidden||!tbPop.hidden) return;
  if(state.mode==='free'&&freeSel.wire!=null&&state.free[freeSel.wire]){
    e.preventDefault(); state.free.splice(freeSel.wire,1); freeSel.wire=null; FRES=null; freeSel.msg=''; render();
  } else if(state.mode==='ext'&&extSel.wire!=null&&state.ext[extSel.wire]){
    e.preventDefault(); state.ext.splice(extSel.wire,1); extSel.wire=null; XRES=null; extSel.msg=''; render();
  }
});
document.addEventListener('keydown',e=>{
  if(!(e.ctrlKey||e.metaKey)||e.key.toLowerCase()!=='z'||e.shiftKey) return;
  if(/INPUT|TEXTAREA/.test(document.activeElement.tagName)) return;
  if(state.mode==='free'&&state.free.length){ e.preventDefault(); freeTool('fundo'); }
  if(state.mode==='ext'&&state.ext.length){ e.preventDefault(); extTool('xundo'); }
});

/* ================= 4단계: 직접 배선·채점 ================= */
const FCOL=[['R','갈색','L1'],['S','흑색','L2'],['T','회색','L3'],['PE','녹-황색','접지'],['ctrl','황색','제어']];
const FCOL_NAME=Object.fromEntries(FCOL.map(c=>[c[0],`${c[1]}(${c[2]})`]));
const FMAXPIN=2; // 한 단자(구멍)에 전선은 2가닥까지
const FZOOMS=[1,1.5,2,2.5];
const freeSel={pin:null,wire:null,net:null,msg:'',showAns:false};
state.free=Array.isArray(state.free)?state.free.filter(w=>w&&PIN[w.a]&&PIN[w.b]&&!isTBf(w.a)&&!isTBf(w.b)&&w.a!==w.b&&FCOL_NAME[w.c]):[];
if(!FCOL_NAME[state.fcol]) state.fcol='ctrl';
if(typeof state.fpins!=='boolean') state.fpins=true;
if(!FZOOMS.includes(state.fzoom)) state.fzoom=1;
let FRES=null, FREE_HL=new Set();

/* 정답 회로(전기적으로 같은 점끼리 묶은 묶음) */
function ufind(pairs){
  const p={}; const f=x=>p[x]===x?x:(p[x]=f(p[x]));
  pairs.forEach(([a,b])=>{ if(!(a in p))p[a]=a; if(!(b in p))p[b]=b; const ra=f(a), rb=f(b); if(ra!==rb) p[ra]=rb; });
  return {has:x=>x in p, root:x=>(x in p)?f(x):null, keys:()=>Object.keys(p)};
}
const ANS_NET=(()=>{
  const u=ufind(WIRES.map(w=>[w.a,w.b])), by={};
  WIRES.forEach((w,i)=>{ const r=u.root(w.a); const n=by[r]||(by[r]={pins:new Set(),wires:[],type:w.type,first:i}); n.pins.add(w.a); n.pins.add(w.b); n.wires.push(w.id); });
  return Object.values(by).sort((a,b)=>a.first-b.first).map((n,i)=>({i,pins:[...n.pins],wires:n.wires,type:n.type}));
})();
const PIN_NET={}; ANS_NET.forEach(n=>n.pins.forEach(p=>PIN_NET[p]=n.i));
/* 기구 안에서 이미 이어진 단자(EOCR ⑩·⑪)는 채점할 때 같은 점으로 봅니다 */
const ALIAS={};
[['EOCR-10','EOCR-11']].forEach(([x,y])=>{ if(!PIN[x]||!PIN[y]) return; if(PIN_NET[x]!=null&&PIN_NET[y]==null) ALIAS[y]=x; else if(PIN_NET[y]!=null&&PIN_NET[x]==null) ALIAS[x]=y; });
const canon=x=>{ x=state.tbmap[x]||x; return ALIAS[x]||x; };
const pinCount=x=>state.free.filter(w=>w.a===x||w.b===x).length;
const plabel=id=>PIN[id].phys?cellLabel(id):PIN[id].label;
const netShort=n=>{ const L=n.pins.map(plabel); return L.length>3?`${L.slice(0,3).join(', ')} 외 ${L.length-3}곳`:L.join(', '); };

/* 사용자가 놓은 선의 배선로 경로 (기구 사이 통과 금지, 직각 배선) */
function routeList(list){
  const out={};
  const plans=list.map(w=>{
    const A=PIN[w.a], B=PIN[w.b];
    if (A.ch===B.ch) return {w,A,B,segs:[{ch:A.ch,x1:A.x,x2:B.x}]};
    const side=(A.x+B.x)<=(800-A.x-B.x)?'L':'R';
    return {w,A,B,side,segs:[{ch:A.ch,x1:A.x,x2:null},{ch:B.ch,x1:B.x,x2:null}]};
  });
  const bych={top:[],mid:[],bot:[]}, mx={L:[],R:[]};
  plans.forEach(p=>{ if(p.side) mx[p.side].push(p); });
  for (const side of ['L','R']){
    const L=mx[side].sort((a,b)=>Math.abs(CH_ORDER[a.A.ch]-CH_ORDER[a.B.ch])-Math.abs(CH_ORDER[b.A.ch]-CH_ORDER[b.B.ch]));
    const [lo,hi]=MARGIN[side], n=L.length;
    L.forEach((p,i)=>{ const f=(i+1)/(n+1); p.mx=side==='L'?hi-(hi-lo)*f:lo+(hi-lo)*f; });
  }
  plans.forEach(p=>p.segs.forEach(s=>{ if(s.x2==null) s.x2=p.mx; bych[s.ch].push({s}); }));
  for (const ch of Object.keys(bych)){
    const L=bych[ch].sort((a,b)=>Math.abs(a.s.x1-a.s.x2)-Math.abs(b.s.x1-b.s.x2)), [lo,hi]=CH[ch], n=L.length;
    L.forEach((o,i)=>{ o.s.y=lo+(hi-lo)*(i+.5)/n; });
  }
  plans.forEach(p=>{
    const [s1,s2]=p.segs;
    const pts=!p.side?[[p.A.x,p.A.y],[p.A.x,s1.y],[p.B.x,s1.y],[p.B.x,p.B.y]]
      :[[p.A.x,p.A.y],[p.A.x,s1.y],[p.mx,s1.y],[p.mx,s2.y],[p.B.x,s2.y],[p.B.x,p.B.y]];
    out[p.w.id]='M'+pts.map(q=>q[0].toFixed(2)+' '+q[1].toFixed(2)).join(' L');
  });
  return out;
}

/* 채점: 단자를 잇는 순서가 달라도, 같은 점끼리 이어져 있으면 정답 */
function gradeFree(){
  const RAW=state.free, W=RAW.map(w=>({...w,a:canon(w.a),b:canon(w.b),raw:w})), u=ufind(W.map(w=>[w.a,w.b])), comp={};
  u.keys().forEach(x=>{ const r=u.root(x); (comp[r]=comp[r]||[]).push(x); });
  const cnt={}; RAW.forEach(w=>{ cnt[w.a]=(cnt[w.a]||0)+1; cnt[w.b]=(cnt[w.b]||0)+1; });
  const nets=ANS_NET.map(n=>{
    const groups={};
    n.pins.forEach(x=>{ const r=u.root(x)||('_'+x); (groups[r]=groups[r]||[]).push(x); });
    const gs=Object.values(groups);
    const missing=n.pins.filter(x=>!u.has(x));
    const foreign=new Set();
    Object.keys(groups).forEach(r=>{ if(r[0]!=='_') comp[r].forEach(x=>{ if(PIN_NET[x]!==n.i) foreign.add(x); }); });
    const badColor=W.filter(w=>PIN_NET[w.a]===n.i && PIN_NET[w.b]===n.i && w.c!==n.type);
    let st='ok';
    if (missing.length===n.pins.length) st='empty';
    else if (foreign.size) st='short';
    else if (gs.length>1) st='split';
    else if (badColor.length) st='color';
    return {n,st,groups:gs,missing,foreign:[...foreign],badColor};
  });
  const extra=W.filter(w=>PIN_NET[w.a]==null||PIN_NET[w.b]==null).map(w=>w.raw);
  const sideIss=tbSideIssues();
  const over=Object.keys(cnt).filter(x=>cnt[x]>FMAXPIN);
  const ok=nets.filter(r=>r.st==='ok').length;
  let score=Math.round(ok/nets.length*100);
  if (score===100 && (extra.length||over.length||sideIss.length)) score=99;
  return {nets,extra,over,sideIss,ok,score,perfect:ok===nets.length&&!extra.length&&!over.length&&!sideIss.length,
    missingPins:new Set(nets.flatMap(r=>r.st==='ok'?[]:r.missing))};
}
function wireVerdict(w){
  if (!FRES) return '';
  const na=PIN_NET[canon(w.a)], nb=PIN_NET[canon(w.b)];
  if (na==null||nb==null||na!==nb) return ' bad';
  return w.c!==ANS_NET[na].type?' bad':'';
}

function freeOverlay(){
  let o='';
  if (freeSel.showAns){ const ph=x=>isTBf(x)?cellOf(x):x; const gl=WIRES.map(w=>({id:'g'+w.id,a:ph(w.a),b:ph(w.b)})).filter(w=>w.a&&w.b&&w.a!==w.b); const G=routeList(gl); o+=gl.map(w=>`<path class="ghost" d="${G[w.id]}"/>`).join(''); }
  const list=state.free.map((w,i)=>({...w,id:'f'+i,i}));
  const R=routeList(list);
  const order=[...list].sort((a,b)=>(a.i===freeSel.wire)-(b.i===freeSel.wire));
  o+=order.map(w=>{
    const d=R[w.id], main=w.c!=='ctrl', cw=main?1.25:.85, on=freeSel.wire===w.i;
    return `<g class="pw t-${w.c}${on?' sel':''}${wireVerdict(w)}${w.i===state.free.length-1&&freeSel.fresh?' fresh':''}" data-fw="${w.i}"><path class="halo" d="${d}" pathLength="1" stroke-width="${on?cw+2.6:cw+(wireVerdict(w)?1.6:.7)}"/><path class="core" d="${d}" pathLength="1" stroke-width="${cw}"/>${w.c==='PE'?`<path class="stripe" d="${d}" stroke-width="${cw*.55}"/>`:''}<path d="${d}" fill="none" stroke="transparent" stroke-width="4"/></g>`;
  }).join('');
  freeSel.fresh=false;
  const cnt={}; state.free.forEach(w=>{ cnt[w.a]=(cnt[w.a]||0)+1; cnt[w.b]=(cnt[w.b]||0)+1; });
  const hl=new Set((freeSel.net!=null?ANS_NET[freeSel.net].pins:[]).map(x=>isTBf(x)?cellOf(x):x).filter(Boolean));
  if (freeSel.wire!=null){ const w=state.free[freeSel.wire]; if(w){ hl.add(w.a); hl.add(w.b); } }
  o+=Object.entries(PIN).filter(([id])=>!isTBf(id)).map(([id,p])=>{
    let c='fpin'; if(p.phys&&!state.tbmap[id]) c+=' unset'; if(tbSel.cell===id) c+=' editing'; if(hl.has(id)) c+=' hl'; const k=cnt[id]||0; if(k>FMAXPIN) c+=' over'; else if(k===FMAXPIN) c+=' full'; else if(k===1) c+=' one'; if(freeSel.pin===id) c+=' pick';
    const miss=FRES&&FRES.missingPins.has(state.tbmap[id]||id)?`<circle class="miss" cx="${p.x}" cy="${p.y}" r="5.2"/>`:'';
    const ring=freeSel.pin===id?`<circle class="ring" cx="${p.x}" cy="${p.y}" r="5.4"/>`:'';
    return `<g class="${c}" data-pin="${id}"><title>${plabel(id)}${cnt[id]?` (${cnt[id]}/${FMAXPIN}가닥)`:''}</title><circle class="hitp" cx="${p.x}" cy="${p.y}" r="5.8"/>${miss}${ring}<circle class="sc" cx="${p.x}" cy="${p.y}" r="3.1"/><text x="${p.x}" y="${p.y+1.2}">${p.t}</text></g>`;
  }).join('');
  return o;
}

const ST_TXT={ok:'정상',empty:'미결선',split:'끊김',short:'오결선',color:'색 틀림'};
function netWhy(r){
  const n=r.n, L=a=>a.map(plabel).join(', ');
  if (r.st==='ok') return `${L(n.pins)}이(가) 하나로 이어져 있어요.`;
  if (r.st==='empty') return `아직 아무 선도 연결하지 않았어요. 이어야 할 단자: ${L(n.pins)}.`;
  if (r.st==='short') return `다른 회로의 단자와 이어졌어요: ${L(r.foreign)}. 전원이 들어가면 오동작하거나 단락됩니다.`;
  if (r.st==='split') return `${r.groups.length}묶음으로 끊겨 있어요: ${r.groups.map(g=>'['+L(g)+']').join(' / ')}. 묶음끼리 이어 주세요.`;
  return `이 회로는 ${FCOL_NAME[n.type]} 전선이어야 해요. ${r.badColor.map(w=>`${plabel(w.raw.a)}↔${plabel(w.raw.b)}(${FCOL_NAME[w.c]})`).join(', ')}의 색을 바꾸세요.`;
}

function renderFree(tools,st){
  tools.innerHTML=`<button class="btn primary" data-act="fgrade">채점하기</button><button class="btn" data-act="fundo"${state.free.length?'':' disabled'}>되돌리기</button><button class="btn" data-act="fpins" aria-pressed="${state.fpins}">도면 핀번호</button><button class="btn" data-act="fans" aria-pressed="${freeSel.showAns}">모범 배선 겹쳐 보기</button><button class="btn" data-act="fclear">모두 지우기</button>`;
  if (FRES) st.innerHTML=FRES.perfect?`<span class="good">${FRES.score}점. 모든 회로가 도면대로 연결됐어요.</span>`
    :`<b>${FRES.score}점</b>, 회로 ${FRES.ok}/${FRES.nets.length}개 정상. 오른쪽 결과에서 빨간 항목을 눌러 위치를 확인하세요.`;
  else st.innerHTML=state.free.length?`<b>${state.free.length}가닥</b> 연결됨. 다 됐으면 채점하기를 누르세요.`:`제어함의 단자 하나를 누르고, 이어질 다른 단자를 누르면 선이 연결됩니다.`;
  renderSchematic(); renderSideFree();
}

function renderSideFree(){
  const z=state.fzoom;
  const pal=FCOL.map(c=>`<button data-fcol="${c[0]}" aria-pressed="${state.fcol===c[0]}"><i class="${c[0]==='PE'?'pe':''}" style="background:var(--w-${c[0]})"></i>${c[2]} ${c[1]}</button>`).join('');

  if (freeSel.wire!=null && state.free[freeSel.wire]){
    const w=state.free[freeSel.wire];
    info=`<h4>${plabel(w.a)} ↔ ${plabel(w.b)}</h4><span class="chip">${FCOL_NAME[w.c]}</span>
      <div class="row" style="display:flex;gap:6px;flex-wrap:wrap;margin-top:6px"><button class="btn" data-act="funwire">이 선 빼기 <kbd>Del</kbd></button>${w.c!==state.fcol?`<button class="btn" data-act="frecolor">${FCOL_NAME[state.fcol]}으로 바꾸기</button>`:''}</div>`;
  } else if (freeSel.pin){
    const n=state.free.filter(w=>w.a===freeSel.pin||w.b===freeSel.pin).length;
    info=`<h4>${plabel(freeSel.pin)} 선택됨</h4>${PIN[freeSel.pin].phys?`<button class="btn" data-tbcell="${freeSel.pin}" style="margin:2px 0 4px">이 단자 용도 바꾸기</button>`:''}<p>이어질 다른 단자를 누르세요. 같은 단자를 다시 누르면 취소돼요. 이 단자에는 ${n}/${FMAXPIN}가닥이 물려 있어요.</p>`;
  } else {
    info=`<h4>단자를 눌러 배선을 시작하세요</h4><p>위에서 전선 색을 고르고, 단자 → 단자 순서로 누르면 배선로를 따라 선이 놓입니다. 놓인 선을 누르면 빼거나 색을 바꿀 수 있어요. 선을 고른 뒤 Delete나 Backspace 키를 눌러도 빠져요.</p>`;
  }
  if (freeSel.msg) info+=`<p class="warn">${freeSel.msg}</p>`;
  let res='';
  if (FRES){
    const bad=FRES.nets.filter(r=>r.st!=='ok'), good=FRES.nets.filter(r=>r.st==='ok'), bad2=bad.filter(r=>r.st!=='empty'), empt=bad.filter(r=>r.st==='empty');
    const item=r=>`<li><button data-net="${r.n.i}" class="${freeSel.net===r.n.i?'sel':''}"><span class="st ${r.st==='ok'?'ok':'bad'}">${ST_TXT[r.st]}</span><span><b>${TYPE_NAME[r.n.type].split(' · ')[0]}</b> ${netShort(r.n)}${freeSel.net===r.n.i?`<span class="why">${netWhy(r)}</span>`:''}</span></button></li>`;
    const ext=[...FRES.extra.map(w=>`<li><button data-xw="${state.free.indexOf(w)}"><span class="st bad">불필요</span><span>${plabel(w.a)} ↔ ${plabel(w.b)}<span class="why">${[w.a,w.b].some(x=>PIN[x].phys&&!state.tbmap[x])?'용도를 정하지 않은 단자대에 연결했어요.':'도면에 없는 연결이에요. 빼 주세요.'}</span></span></button></li>`),
      ...FRES.sideIss.map(r=>`<li><button data-tbcell="${r.cell}"><span class="st bad">배관 방향</span><span>${cellLabel(r.cell)}<span class="why">${r.side}에는 ${r.f.to} 쪽으로 가는 배관이 없어요. 3단계에서 연결할 수 없으니 다른 단자대로 옮기세요.</span></span></button></li>`),
      ...FRES.over.map(x=>`<li><button data-xp="${x}"><span class="st bad">규칙 위반</span><span>${plabel(x)}<span class="why">한 단자에 ${FMAXPIN}가닥을 넘게 물렸어요. 같은 점에 묶인 다른 단자로 건너(점퍼) 연결하세요.</span></span></button></li>`)].join('');
    res=`<div class="card fres"><div class="score"><b>${FRES.score}점</b><span>회로 ${FRES.ok}/${FRES.nets.length}개 정상${FRES.extra.length?`, 불필요한 선 ${FRES.extra.length}`:''}${FRES.over.length?`, 규칙 위반 단자 ${FRES.over.length}`:''}</span></div>
      <p class="verdict ${FRES.perfect?'ok':'no'}">${FRES.perfect?'도면대로 동작하는 배선이에요. 시험장에서도 이 순서로 해 보세요.':'실제 시험에서는 미결선·오결선으로 동작하지 않으면 실격이에요. 아래 항목을 눌러 위치를 확인하세요.'}</p>
      ${bad2.length||ext?`<ul class="nlist">${bad2.map(item).join('')}${ext}</ul>`:''}${empt.length?`<details><summary>아직 연결하지 않은 회로 ${empt.length}개 보기</summary><ul class="nlist">${empt.map(item).join('')}</ul></details>`:''}
      ${good.length?`<details${bad.length?'':' open'}><summary>정상인 회로 ${good.length}개 보기</summary><ul class="nlist oks">${good.map(item).join('')}</ul></details>`:''}
      <p style="font-size:12.5px;color:var(--ink-soft);margin-top:10px">공통선을 어느 단자부터 건너 연결했는지는 상관없어요. 같은 점이어야 할 단자끼리 모두 이어져 있고, 다른 회로와 섞이지 않았는지를 봅니다.</p></div>`;
  }
  $('#side').innerHTML=`<div class="pane-bar"><h3>제어함 직접 배선</h3>
      <div class="zoomer"><button class="btn" data-act="fzout" aria-label="축소"${z===FZOOMS[0]?' disabled':''}>−</button><span>${Math.round(z*100)}%</span><button class="btn" data-act="fzin" aria-label="확대"${z===FZOOMS[FZOOMS.length-1]?' disabled':''}>+</button><button class="btn" data-act="big">${state.big?'나란히 보기':'크게 보기'}</button></div></div>
    <p class="palette-cap">전선 색</p><div class="palette">${pal}</div>
    <div class="quick"><button class="btn" data-act="fundo"${state.free.length?'':' disabled'}>되돌리기</button><span>${state.free.length?`방금 연결: ${plabel(state.free[state.free.length-1].a)} ↔ ${plabel(state.free[state.free.length-1].b)}`:'아직 연결한 선이 없어요.'}</span></div>
    <p class="palette-cap">단자대 용도 정하기 (칸을 눌러 무엇을 연결할 단자인지 정하세요, ${Object.keys(state.tbmap).length}/${TBFUNC.length}개)</p>${tbStripHTML('set')}${tbAnsHTML()}
    <div class="fwrap"><svg id="fpanel" viewBox="-6 -6 412 432" style="width:max(100%, ${Math.round(620*z)}px)" role="img" aria-label="제어함 직접 배선">${panelSVG()}</svg></div>
    <div class="card info" style="margin-top:12px">${info}</div>${res}
    <div class="card rules"><h4 style="color:var(--ink)">배선 규칙</h4><ul>
      <li><b>한 단자에 ${FMAXPIN}가닥까지</b>: ${FMAXPIN}가닥이 찬 단자(진하게 표시)는 더 누를 수 없어요. 같은 점은 옆 단자로 건너가며(점퍼) 이어요.</li>
      <li><b>전선 색</b>: 주회로 L1 갈색, L2 흑색, L3 회색, 접지 녹-황색, 제어회로 황색. 색이 틀리면 채점에서 틀린 회로가 돼요.</li>
      <li><b>배선로로만</b>: 선은 기구 사이를 지나지 않고 회색 배선로와 양쪽 가장자리를 따라 직각으로 놓여요.</li>
      <li><b>외부 기구는 단자대로</b>: 푸시버튼, 셀렉터, 램프, 부저, 전극, 전원, 전동기는 TB5·TB6 단자에 연결해요. 어느 칸을 무엇으로 쓸지는 직접 정하고, 배관이 나가는 쪽(TB5 위, TB6 아래)에 맞춰 두세요.</li>
      <li><b>기구 내부 연결</b>: EOCR ⑩과 ⑪은 기구 안에서 이어져 있어 같은 점으로 채점해요.</li></ul></div>`;
}

function addFreeWire(a,b){
  if (state.free.some(w=>(w.a===a&&w.b===b)||(w.a===b&&w.b===a))){ freeSel.msg='이미 이 두 단자를 잇는 선이 있어요.'; return false; }
  const full=[a,b].filter(x=>pinCount(x)>=FMAXPIN);
  if (full.length){ freeSel.msg=`${full.map(plabel).join(', ')}에는 이미 ${FMAXPIN}가닥이 물려 있어 더 연결할 수 없어요. 같은 점에 이어진 다른 단자에서 건너 연결하세요.`; return false; }
  state.free.push({a,b,c:state.fcol}); freeSel.fresh=true; FRES=null; freeSel.msg=''; return true;
}
function freeSideClick(e){
  if (tbSideClick(e)) return;
  const pin=e.target.closest('[data-pin]');
  if (pin){
    const id=pin.dataset.pin; freeSel.wire=null; freeSel.msg='';
    if (PIN[id].phys&&!state.tbmap[id]){ tbOpen(id,`#fpanel [data-pin="${id}"]`); freeSel.msg=`${cellName(id)} 단자는 아직 용도를 정하지 않았어요. 뜬 창에서 먼저 고르세요.`; render(); return; }
    if (!freeSel.pin){
      if (pinCount(id)>=FMAXPIN) freeSel.msg=`${plabel(id)}에는 이미 ${FMAXPIN}가닥이 물려 있어요. 한 단자에는 ${FMAXPIN}가닥까지만 연결할 수 있어요.`;
      else freeSel.pin=id;
    }
    else if (freeSel.pin===id) freeSel.pin=null;
    else { addFreeWire(freeSel.pin,id); freeSel.pin=null; }

  }
  const fw=e.target.closest('[data-fw]');
  if (fw){ const i=+fw.dataset.fw; freeSel.wire=(freeSel.wire===i?null:i); freeSel.pin=null; freeSel.msg=''; render(); return; }
  const fc=e.target.closest('[data-fcol]');
  if (fc){ state.fcol=fc.dataset.fcol; freeSel.msg=''; render(); return; }
  const nb=e.target.closest('[data-net]');
  if (nb){ const i=+nb.dataset.net; freeSel.net=(freeSel.net===i?null:i); FREE_HL=new Set(freeSel.net!=null?ANS_NET[i].wires:[]); freeSel.wire=null; render(); return; }
  const xw=e.target.closest('[data-xw]');
  if (xw){ freeSel.wire=+xw.dataset.xw; freeSel.net=null; FREE_HL=new Set(); render(); return; }
  const xp=e.target.closest('[data-xp]');
  if (xp){ freeSel.net=null; FREE_HL=new Set(); freeSel.pin=xp.dataset.xp; render(); return; }
  const b=e.target.closest('[data-act]'); if(!b) return; const a=b.dataset.act;

  if (a==='fzin'||a==='fzout'){ const i=FZOOMS.indexOf(state.fzoom)+(a==='fzin'?1:-1); state.fzoom=FZOOMS[Math.max(0,Math.min(FZOOMS.length-1,i))]; render(); }
  if (a==='funwire' && freeSel.wire!=null){ state.free.splice(freeSel.wire,1); freeSel.wire=null; FRES=null; freeSel.msg=''; render(); }
  if (a==='frecolor' && freeSel.wire!=null){ state.free[freeSel.wire].c=state.fcol; FRES=null; render(); }
}
function freeTool(a){
  if (a==='fgrade'){
    if (!state.free.length){ freeSel.msg='아직 연결한 선이 없어요. 단자를 눌러 배선한 뒤 채점하세요.'; render(); return; }
    FRES=gradeFree(); freeSel.pin=null; freeSel.wire=null; freeSel.msg='';
    const first=FRES.nets.find(r=>r.st!=='ok'&&r.st!=='empty')||FRES.nets.find(r=>r.st!=='ok');
    freeSel.net=first?first.n.i:null; FREE_HL=new Set(first?first.n.wires:[]);
    render();
    const r=document.querySelector('.fres'); if(r && window.innerWidth<1180) r.scrollIntoView({behavior:'smooth',block:'start'});
    return;
  }
  if (a==='fundo'){ state.free.pop(); freeSel.wire=null; FRES=null; freeSel.msg=''; }
  if (a==='fpins'){ state.fpins=!state.fpins; }
  if (a==='fans'){ freeSel.showAns=!freeSel.showAns; }
  if (a==='fclear'){ if(!state.free.length) return; ask(`제어판에 연결한 선 ${state.free.length}가닥을 모두 지울까요?`,'모두 지우기',()=>{ state.free=[]; FRES=null; Object.assign(freeSel,{pin:null,wire:null,net:null,msg:''}); FREE_HL=new Set(); render(); },document.querySelector('[data-act="fclear"]')); return; }
  render();
}

/* ================= 3단계: 배관·단자대 배선 ================= */
const XZOOMS=[1,1.5,2,3];
const extSel={pin:null,wire:null,net:null,duct:null,msg:'',fresh:false,showAns:false};
state.ext=Array.isArray(state.ext)?state.ext.filter(w=>w&&LT[w.a]&&LT[w.b]&&!isTBf(w.a)&&!isTBf(w.b)&&w.a!==w.b&&FCOL_NAME[w.c]):[];
if(!XZOOMS.includes(state.xzoom)) state.xzoom=1;
let XRES=null, EXT_HL=new Set();

const tbSide=id=>/^TB5[#-]/.test(id)?'TB5':/^TB6[#-]/.test(id)?'TB6':null;
const XNODE={TB5:'제어함 TB5',TB6:'제어함 TB6'};
/* 단자 → 기구함(그룹) */
const XGROUP={};
LCFG.boxes.forEach((b,i)=>b[4].forEach(id=>XGROUP[id]='B'+i));
Object.keys(LT).forEach(id=>{ if(!tbSide(id) && !XGROUP[id]) XGROUP[id]=id.split('-')[0]; });
const xlabel=id=>{ if(isTBf(id)) return PIN[id].label; if(LT[id]&&id.includes('#')) return cellLabel(id); return `${id.split('-')[0]} ${LT[id][2]}`; };
/* 배관 그래프 */
const DADJ={};
DUCTS.forEach(d=>{ (DADJ[d.from]=DADJ[d.from]||[]).push([d.to,d.id]); (DADJ[d.to]=DADJ[d.to]||[]).push([d.from,d.id]); });
function walkEnd(start,chain){ let cur=start; chain.forEach(id=>{ const d=DUCTS.find(x=>x.id===id); cur=d.from===cur?d.to:d.from; }); return cur; }
/* 그룹이 배관 끝에서 닿는 곳 (정답 배선에서 읽어 옴) */
const GNODE={};
EXTW.forEach(w=>{ const g=XGROUP[w[1]]; if(g && !GNODE[g]) GNODE[g]=walkEnd(XNODE[tbSide(w[0])],w[3]); });
const GNAME={}; Object.entries(GNODE).forEach(([g,n])=>GNAME[g]=n);
function ductPath(from,to){
  const prev={[from]:null}, q=[from];
  while(q.length){ const u=q.shift(); if(u===to) break; (DADJ[u]||[]).forEach(([v,id])=>{ if(!(v in prev)){ prev[v]=[u,id]; q.push(v); } }); }
  if(!(to in prev)) return null;
  const out=[]; let c=to; while(prev[c]){ out.unshift(prev[c][1]); c=prev[c][0]; }
  return out;
}
/* 정답: 외부 배선 + 기구함 안 점퍼 */
const LT_AT=(x,y)=>Object.keys(LT).find(k=>Math.abs(LT[k][0]-x)<.6&&Math.abs(LT[k][1]-y)<.6);
const XANS_PAIRS=[...EXTW.map(w=>[w[0],w[1],w[2]]), ...JUMPS.map(j=>{ const a=j.pts[0], b=j.pts[j.pts.length-1]; return [LT_AT(a[0],a[1]),LT_AT(b[0],b[1]),'ctrl']; }).filter(p=>p[0]&&p[1])];
const XNET=(()=>{
  const u=ufind(XANS_PAIRS.map(p=>[p[0],p[1]])), by={};
  XANS_PAIRS.forEach((p,i)=>{ const r=u.root(p[0]); const n=by[r]||(by[r]={pins:new Set(),type:p[2],first:i}); n.pins.add(p[0]); n.pins.add(p[1]); });
  return Object.values(by).sort((a,b)=>a.first-b.first).map((n,i)=>({i,pins:[...n.pins],type:n.type}));
})();
const XPIN_NET={}; XNET.forEach(n=>n.pins.forEach(p=>XPIN_NET[p]=n.i));
const xCount=id=>state.ext.filter(w=>w.a===id||w.b===id).length;

/* 사용자 선 → 그리기용 정보 */
function extPlan(w){
  const sa=tbSide(w.a), sb=tbSide(w.b);
  if (sa||sb){ const tb=sa?w.a:w.b, ex=sa?w.b:w.a; const chain=ductPath(XNODE[tbSide(tb)],GNODE[XGROUP[ex]]); return {kind:'ext',tb,ex,chain}; }
  return {kind:'jump',a:w.a,b:w.b};
}
function extSegsFor(list){ // list: [{tb,ex,c,chain,i}]
  const cnt={}, slot=[];
  list.forEach((w,i)=>{ slot[i]={}; w.chain.forEach(c=>{ slot[i][c]=cnt[c]||0; cnt[c]=(cnt[c]||0)+1; }); });
  const dir=(a,b)=>[Math.sign(b[0]-a[0]),Math.sign(b[1]-a[1])];
  return list.map((w,i)=>{
    const segs=[]; let prev=null;
    w.chain.forEach((cid,ci)=>{
      const d=DUCTS.find(x=>x.id===cid), j=slot[i][cid], m=cnt[cid], k=(j-(m-1)/2)*5;
      const op=offsetPts(d.pts,k); let pts=[];
      if(ci===0){ const T=LT[w.tb], d0=dir(d.pts[0],d.pts[1]), L=(LANE0[cid]||8)+j*3.5, ly=op[0][1]-d0[1]*L; pts=[[T[0],T[1]],[T[0],ly],[op[0][0],ly],...op]; }
      else { const S=op[0], d0=dir(d.pts[0],d.pts[1]); pts=d0[0]===0?[prev,[S[0],prev[1]],...op]:[prev,[JX,prev[1]],[JX,S[1]],...op]; }
      if(ci===w.chain.length-1){ const n=d.pts.length, dn=dir(d.pts[n-2],d.pts[n-1]), Pn=op[op.length-1], L=8+j*5, D=LT[w.ex];
        const Q=[Pn[0]+dn[0]*L,Pn[1]+dn[1]*L]; pts.push(Q, dn[0]===0?[D[0],Q[1]]:[Q[0],D[1]], [D[0],D[1]]); }
      prev=pts[pts.length-1]; segs.push(pts);
    });
    return segs;
  });
}
function jumpPts(a,b){
  const A=LT[a], B=LT[b];
  const my=A[1]===B[1]?A[1]+22:(A[1]+B[1])/2;
  return [[A[0],A[1]],[A[0],my],[B[0],my],[B[0],B[1]]];
}
function userDuctCounts(){
  const c={}; state.ext.forEach(w=>{ const p=extPlan(w); if(p.kind==='ext'&&p.chain) p.chain.forEach(id=>c[id]=(c[id]||0)+1); }); return c;
}

/* 채점 */
function gradeExt(){
  const tc=x=>state.tbmap[x]||x, W=state.ext.map(w=>({...w,a:tc(w.a),b:tc(w.b),raw:w})), u=ufind(W.map(w=>[w.a,w.b])), comp={};
  u.keys().forEach(x=>{ const r=u.root(x); (comp[r]=comp[r]||[]).push(x); });
  const cnt={}; state.ext.forEach(w=>{ cnt[w.a]=(cnt[w.a]||0)+1; cnt[w.b]=(cnt[w.b]||0)+1; });
  const nets=XNET.map(n=>{
    const groups={};
    n.pins.forEach(x=>{ const r=u.root(x)||('_'+x); (groups[r]=groups[r]||[]).push(x); });
    const gs=Object.values(groups), missing=n.pins.filter(x=>!u.has(x)), foreign=new Set();
    Object.keys(groups).forEach(r=>{ if(r[0]!=='_') comp[r].forEach(x=>{ if(XPIN_NET[x]!==n.i) foreign.add(x); }); });
    const badColor=W.filter(w=>XPIN_NET[w.a]===n.i && XPIN_NET[w.b]===n.i && w.c!==n.type);
    let st='ok';
    if (missing.length===n.pins.length) st='empty'; else if (foreign.size) st='short'; else if (gs.length>1) st='split'; else if (badColor.length) st='color';
    return {n,st,groups:gs,missing,foreign:[...foreign],badColor};
  });
  const uc=userDuctCounts();
  const ducts=DUCTS.map(d=>({d,need:d.wires.length,have:uc[d.id]||0,ok:(uc[d.id]||0)===d.wires.length}));
  const extra=W.filter(w=>XPIN_NET[w.a]==null||XPIN_NET[w.b]==null).map(w=>w.raw);
  const over=Object.keys(cnt).filter(x=>cnt[x]>FMAXPIN);
  const okN=nets.filter(r=>r.st==='ok').length, okD=ducts.filter(r=>r.ok).length;
  let score=Math.round((okN+okD)/(nets.length+ducts.length)*100);
  const perfect=okN===nets.length&&okD===ducts.length&&!extra.length&&!over.length;
  if (score===100&&!perfect) score=99;
  return {nets,ducts,extra,over,okN,okD,score,perfect,missingPins:new Set(nets.flatMap(r=>r.st==='ok'?[]:r.missing))};
}
function xWireBad(w){
  if (!XRES) return false;
  const na=XPIN_NET[state.tbmap[w.a]||w.a], nb=XPIN_NET[state.tbmap[w.b]||w.b];
  return na==null||nb==null||na!==nb||w.c!==XNET[na].type;
}
function xNetWhy(r){
  const n=r.n, L=a=>a.map(xlabel).join(', ');
  if (r.st==='ok') return `${L(n.pins)}이(가) 하나로 이어져 있어요.`;
  if (r.st==='empty') return `아직 연결하지 않았어요. 이어야 할 단자: ${L(n.pins)}.`;
  if (r.st==='short') return `다른 회로의 단자와 이어졌어요: ${L(r.foreign)}.`;
  if (r.st==='split') return `${r.groups.length}묶음으로 끊겨 있어요: ${r.groups.map(g=>'['+L(g)+']').join(' / ')}.`;
  return `이 회로는 ${FCOL_NAME[n.type]} 전선이어야 해요. ${r.badColor.map(w=>`${xlabel(w.raw.a)}↔${xlabel(w.raw.b)}(${FCOL_NAME[w.c]})`).join(', ')}의 색을 바꾸세요.`;
}
const xNetShort=n=>{ const L=n.pins.map(xlabel); return L.length>3?`${L.slice(0,3).join(', ')} 외 ${L.length-3}곳`:L.join(', '); };

/* 그리기 */
function renderExtLayout(){
  let tubes='';
  const uc=userDuctCounts();
  DUCTS.forEach(d=>{
    const m=d.wires.length, wd=m*5+(d.no===3?6:12), pd=polyD(d.pts);
    let c=`cond n${d.no}`; if(extSel.duct===d.id) c+=' sel';
    if (XRES && !XRES.ducts.find(r=>r.d.id===d.id).ok) c+=' xbad';
    let g=`<path class="tube" d="${pd}" stroke-width="${wd}"/>`;
    if(d.no===2) g+=`<path class="rib" d="${pd}" stroke-width="${wd}"/>`;
    g+=`<path class="inner" d="${pd}" stroke-width="${wd-(d.no===3?4:8)}"/>`+slashes(d);
    tubes+=`<g class="${c}" style="cursor:default">${g}</g>`;
  });
  let ghost='';
  if (extSel.showAns){
    const gl=EXTW.map(w=>({tb:cellOf(w[0]),ex:w[1]})).filter(o=>o.tb).map(o=>({...o,chain:ductPath(XNODE[tbSide(o.tb)],GNODE[XGROUP[o.ex]])})).filter(o=>o.chain);
    extSegsFor(gl).forEach(segs=>segs.forEach(pts=>ghost+=`<path class="xghost" d="${polyD(pts)}"/>`));
    JUMPS.forEach(j=>ghost+=`<path class="xghost" d="${polyD(j.pts)}"/>`);
  }
  const list=state.ext.map((w,i)=>({w,i,p:extPlan(w)}));
  const exts=list.filter(o=>o.p.kind==='ext'&&o.p.chain).map(o=>({...o.p,c:o.w.c,i:o.i}));
  const segs=extSegsFor(exts);
  let wires='';
  const draw=(i,c,ds)=>{ const on=extSel.wire===i, bad=xWireBad(state.ext[i]), fr=extSel.fresh&&i===state.ext.length-1;
    return `<g class="uw t-${c}${on?' sel':''}${bad?' bad':''}${fr?' fresh':''}" data-xw="${i}">${ds.map(d=>`<path class="h" d="${d}"/>`).join('')}${ds.map(d=>`<path class="lw t-${c}" d="${d}" pathLength="1"/>`).join('')}${c==='PE'?ds.map(d=>`<path class="pes" d="${d}"/>`).join(''):''}${ds.map(d=>`<path class="hit" d="${d}"/>`).join('')}</g>`; };
  exts.forEach((w,k)=>wires+=draw(w.i,w.c,segs[k].map(polyD)));
  list.filter(o=>o.p.kind==='jump').forEach(o=>wires+=draw(o.i,o.w.c,[polyD(jumpPts(o.w.a,o.w.b))]));
  extSel.fresh=false;
  const hl=new Set((extSel.net!=null?XNET[extSel.net].pins:[]).map(x=>isTBf(x)?cellOf(x):x).filter(Boolean));
  if (extSel.wire!=null&&state.ext[extSel.wire]){ hl.add(state.ext[extSel.wire].a); hl.add(state.ext[extSel.wire].b); }
  let pins='';
  Object.keys(LT).forEach(id=>{ if(isTBf(id)) return; const [x,y]=LT[id], tb=!!tbSide(id), r=tb?4:5.5, k=xCount(id);
    let c='xpin'; if(k>FMAXPIN) c+=' over'; else if(k===FMAXPIN) c+=' full'; else if(k===1) c+=' one'; if(hl.has(id)) c+=' hl'; if(extSel.pin===id) c+=' pick';
    pins+=`<g class="${c}" data-xp="${id}"><title>${xlabel(id)}${k?` (${k}/${FMAXPIN}가닥)`:''}</title><circle class="hitp" cx="${x}" cy="${y}" r="${tb?6.2:11}"/>${XRES&&XRES.missingPins.has(state.tbmap[id]||id)?`<circle class="miss" cx="${x}" cy="${y}" r="${r+4}"/>`:''}${extSel.pin===id?`<circle class="ring" cx="${x}" cy="${y}" r="${r+4}"/>`:''}<circle class="sc" cx="${x}" cy="${y}" r="${r}"/></g>`; });
  const lay=$('#lay'); lay.setAttribute('class','mode-ext'); lay.style.width=`max(100%, ${Math.round(720*state.xzoom)}px)`;

  lay.innerHTML=LAY_STATIC+tbl+tubes+ghost+`<g class="uws">${wires}</g>`+pins;
}

  let res='';

    const item=r=>`<li><button data-xnet="${r.n.i}" class="${extSel.net===r.n.i?'sel':''}"><span class="st ${r.st==='ok'?'ok':'bad'}">${ST_TXT[r.st]}</span><span><b>${TYPE_NAME[r.n.type].split(' · ')[0]}</b> ${xNetShort(r.n)}${extSel.net===r.n.i?`<span class="why">${xNetWhy(r)}</span>`:''}</span></button></li>`;
    const dbad=XRES.ducts.filter(r=>!r.ok).map(r=>`<li><button data-xd="${r.d.id}"><span class="st bad">가닥 수</span><span>${circ(r.d.no)} ${r.d.from} → ${r.d.to}<span class="why">지금 ${r.have}가닥, 도면 빗금은 ${r.need}가닥이에요.${r.have>r.need?' 공통선은 기구함 안에서 점퍼로 묶어 가닥 수를 줄이세요.':''}</span></span></button></li>`).join('');
    const ext=[...XRES.extra.map(w=>`<li><button data-xwsel="${state.ext.indexOf(w)}"><span class="st bad">불필요</span><span>${xlabel(w.a)} ↔ ${xlabel(w.b)}<span class="why">도면에 없는 연결이에요.</span></span></button></li>`),
      ...XRES.over.map(x=>`<li><button data-xpsel="${x}"><span class="st bad">규칙 위반</span><span>${xlabel(x)}<span class="why">한 단자에 ${FMAXPIN}가닥을 넘게 물렸어요.</span></span></button></li>`)].join('');
    res=`<div class="card fres"><div class="score"><b>${XRES.score}점</b><span>회로 ${XRES.okN}/${XRES.nets.length}개, 배관 가닥 수 ${XRES.okD}/${XRES.ducts.length}개 정상</span></div>
      <p class="verdict ${XRES.perfect?'ok':'no'}">${XRES.perfect?'배관과 단자대 배선이 도면과 같아요.':'빨간 항목을 눌러 배치도에서 위치를 확인하세요.'}</p>

      ${good.length?`<details${bad.length?'':' open'}><summary>정상인 회로 ${good.length}개 보기</summary><ul class="nlist oks">${good.map(item).join('')}</ul></details>`:''}</div>`;

      <div class="zoomer"><button class="btn" data-act="xzout" aria-label="배치도 축소"${z===XZOOMS[0]?' disabled':''}>−</button><span>${Math.round(z*100)}%</span><button class="btn" data-act="xzin" aria-label="배치도 확대"${z===XZOOMS[XZOOMS.length-1]?' disabled':''}>+</button><button class="btn" data-act="big">${state.big?'나란히 보기':'크게 보기'}</button></div></div>
    <p class="palette-cap">전선 색</p><div class="palette">${pal}</div>
    <div class="quick"><button class="btn" data-act="xundo"${state.ext.length?'':' disabled'}>되돌리기</button><span>${state.ext.length?`방금 연결: ${xlabel(state.ext[state.ext.length-1].a)} ↔ ${xlabel(state.ext[state.ext.length-1].b)}`:'아직 연결한 선이 없어요.'}</span></div>
    <p class="palette-cap">제어함 단자대 (바깥쪽). 2단계에서 정한 용도가 보여요. 빈 칸을 누르면 용도를 정할 수 있어요.</p>${tbStripHTML('wire')}${tbAnsHTML()}

      <li><b>가닥 수 = 빗금 수</b>: 배관마다 넣은 전선 수가 도면의 빗금(/) 수와 같아야 해요.</li>
      <li><b>공통선은 함 안에서 점퍼</b>: 램프·부저·푸시버튼의 공통은 기구함 안의 두 단자를 이어 한 가닥으로 보내요.</li>
      <li><b>관 안 접속 금지, 한 단자 ${FMAXPIN}가닥까지</b>: 전선은 단자에서만 잇고, 한 단자에는 ${FMAXPIN}가닥까지만 물려요.</li></ul></div>`;
}

function renderExt(tools,st){
  tools.innerHTML=`<button class="btn primary" data-act="xgrade">채점하기</button><button class="btn" data-act="xundo"${state.ext.length?'':' disabled'}>되돌리기</button><button class="btn" data-act="xans" aria-pressed="${extSel.showAns}">모범 배선 겹쳐 보기</button><button class="btn" data-act="xclear">모두 지우기</button>`;
  if (XRES) st.innerHTML=XRES.perfect?`<span class="good">${XRES.score}점. 배관과 단자대 배선이 모두 맞았어요.</span>`:`<b>${XRES.score}점</b>, 회로 ${XRES.okN}/${XRES.nets.length}개, 배관 ${XRES.okD}/${XRES.ducts.length}개 정상.`;
  else st.innerHTML=state.ext.length?`<b>${state.ext.length}가닥</b> 연결됨. 다 됐으면 채점하기를 누르세요.`:`단자를 하나 누르고 이어질 단자를 누르면 배관을 따라 선이 들어갑니다.`;
  renderExtLayout(); renderSideExt();
}

function addExtWire(a,b){
  if (state.ext.some(w=>(w.a===a&&w.b===b)||(w.a===b&&w.b===a))){ extSel.msg='이미 이 두 단자를 잇는 선이 있어요.'; return false; }
  const sa=tbSide(a), sb=tbSide(b);
  if (sa&&sb){ extSel.msg='제어함 단자대끼리의 연결은 제어함 안 배선(2단계)에서 해요.'; return false; }
  if (!sa&&!sb && XGROUP[a]!==XGROUP[b]){ extSel.msg='기구함끼리는 바로 잇지 않아요. 각각 제어함 단자대에서 배관을 따라 보내세요.'; return false; }
  if (sa||sb){ const tb=sa?a:b, ex=sa?b:a, g=GNODE[XGROUP[ex]];
    if (!g || !ductPath(XNODE[tbSide(tb)],g)){ extSel.msg=`${tbSide(tb)}에서 ${xlabel(ex)} 쪽으로 가는 배관이 없어요. 배치도에서 그 기구함의 배관이 어느 단자대에서 나가는지 확인하세요.`; return false; } }
  const full=[a,b].filter(x=>xCount(x)>=FMAXPIN);
  if (full.length){ extSel.msg=`${full.map(xlabel).join(', ')}에는 이미 ${FMAXPIN}가닥이 물려 있어요.`; return false; }
  state.ext.push({a,b,c:state.fcol}); extSel.fresh=true; XRES=null; extSel.msg=''; return true;
}
function extPinClick(id){
  extSel.wire=null; extSel.msg='';
  if (id.includes('#')&&!state.tbmap[id]){ tbOpen(id,`#lay [data-xp="${id}"]`); extSel.msg=`${cellName(id)} 단자는 아직 용도를 정하지 않았어요. 뜬 창에서 먼저 고르세요.`; render(); return; }
  if (!extSel.pin){ if (xCount(id)>=FMAXPIN) extSel.msg=`${xlabel(id)}에는 이미 ${FMAXPIN}가닥이 물려 있어요.`; else extSel.pin=id; }
  else if (extSel.pin===id) extSel.pin=null;
  else { addExtWire(extSel.pin,id); extSel.pin=null; }
  render();
}
function extSideClick(e){
  if (tbSideClick(e)) return;
  { const b=e.target.closest('[data-act]'); if(b&&b.dataset.act==='xundo'){ extTool('xundo'); return; } }
  const p=e.target.closest('[data-xp]'); if (p){ extPinClick(p.dataset.xp); return; }
  const fc=e.target.closest('[data-fcol]'); if (fc){ state.fcol=fc.dataset.fcol; extSel.msg=''; render(); return; }
  const n=e.target.closest('[data-xnet]'); if (n){ const i=+n.dataset.xnet; extSel.net=extSel.net===i?null:i; extSel.wire=null; extSel.duct=null; render(); return; }
  const d=e.target.closest('[data-xd]'); if (d){ extSel.duct=extSel.duct===d.dataset.xd?null:d.dataset.xd; extSel.net=null; render(); return; }
  const ws=e.target.closest('[data-xwsel]'); if (ws){ extSel.wire=+ws.dataset.xwsel; extSel.net=null; render(); return; }
  const ps=e.target.closest('[data-xpsel]'); if (ps){ extSel.net=null; extSel.pin=null; extSel.wire=state.ext.findIndex(w=>w.a===ps.dataset.xpsel||w.b===ps.dataset.xpsel); render(); return; }
  const b=e.target.closest('[data-act]'); if(!b) return; const a=b.dataset.act;
  if (a==='big'){ state.big=!state.big; render(); }
  if (a==='xzin'||a==='xzout'){ const i=XZOOMS.indexOf(state.xzoom)+(a==='xzin'?1:-1); state.xzoom=XZOOMS[Math.max(0,Math.min(XZOOMS.length-1,i))]; render(); }
  if (a==='xunwire'&&extSel.wire!=null){ state.ext.splice(extSel.wire,1); extSel.wire=null; XRES=null; render(); }
  if (a==='xrecolor'&&extSel.wire!=null){ state.ext[extSel.wire].c=state.fcol; XRES=null; render(); }
}
function extTool(a){
  if (a==='xgrade'){
    if (!state.ext.length){ extSel.msg='아직 연결한 선이 없어요.'; render(); return; }
    XRES=gradeExt(); extSel.pin=null; extSel.wire=null; extSel.msg='';
    const first=XRES.nets.find(r=>r.st!=='ok'&&r.st!=='empty')||XRES.nets.find(r=>r.st!=='ok'); extSel.net=first?first.n.i:null;
    render(); const r=document.querySelector('.fres'); if(r&&window.innerWidth<1180) r.scrollIntoView({behavior:'smooth',block:'start'}); return;
  }
  if (a==='xundo'){ state.ext.pop(); extSel.wire=null; XRES=null; }
  if (a==='xans'){ extSel.showAns=!extSel.showAns; }
  if (a==='xclear'){ if(!state.ext.length) return; ask(`배관·단자대에 연결한 선 ${state.ext.length}가닥을 모두 지울까요?`,'모두 지우기',()=>{ state.ext=[]; XRES=null; Object.assign(extSel,{pin:null,wire:null,net:null,duct:null,msg:''}); render(); },document.querySelector('[data-act="xclear"]')); return; }
  render();
}
$('#lay').addEventListener('click',e=>{
  if (state.mode!=='ext') return;
  const p=e.target.closest('[data-xp]'); if (p){ extPinClick(p.dataset.xp); return; }
  const w=e.target.closest('[data-xw]'); if (w){ const i=+w.dataset.xw; extSel.wire=extSel.wire===i?null:i; extSel.pin=null; extSel.msg=''; render(); }
});

if(!['pins','free','ext'].includes(state.mode)) state.mode='pins';

/* ================= 이벤트 ================= */
function connect(id){ wired.add(id); sel.wire=id; sel.fresh=id; if(sel.hint===id) sel.hint=null; }
$('#sch').addEventListener('click',e=>{
  const s=e.target.closest('[data-slot]');
  if (s && state.mode==='pins'){ const [id,i]=s.dataset.slot.split(':'); openKeypad(id,+i); return; }
  const w=e.target.closest('[data-wire]');
  if (w && state.mode==='wire'){ const id=w.dataset.wire; if(!wired.has(id)) connect(id); else sel.wire=(sel.wire===id?null:id); render(); }
});
$('#sch').addEventListener('keydown',e=>{
  const s=e.target.closest('[data-slot]');
  if (s && (e.key==='Enter'||e.key===' ')){ e.preventDefault(); const [id,i]=s.dataset.slot.split(':'); openKeypad(id,+i); }
});
$('#side').addEventListener('click',e=>{
  if (state.mode==='free'){ freeSideClick(e); return; }
  if (state.mode==='ext'){ extSideClick(e); return; }
  const db=e.target.closest('button[data-duct]');
  if (db){ sel.duct=(sel.duct===db.dataset.duct?null:db.dataset.duct); sel.dhint=null; render(); return; }
  const pw=e.target.closest('.pw');
  if (pw){ sel.wire=(sel.wire===pw.dataset.wire?null:pw.dataset.wire); render(); return; }
  const b=e.target.closest('[data-act]'); if(!b) return;
  if (b.dataset.act==='unwire'){ wired.delete(sel.wire); render(); }
  if (b.dataset.act==='wireit'){ connect(sel.wire); render(); }
  if (b.dataset.act==='big'){ state.big=!state.big; render(); }
  if (b.dataset.act==='unduct'){ ducted.delete(sel.duct); render(); }
  if (b.dataset.act==='ductit'){ ducted.add(sel.duct); sel.dfresh=sel.duct; render(); }
});
function refHi(card,pins){
  const ps=pins.map(String), key=[...pins].sort((a,b)=>a-b).join();
  card.querySelectorAll('[data-p]').forEach(g=>g.classList.toggle('hl',ps.includes(g.dataset.p)));
  card.querySelectorAll('.it').forEach(g=>{ const it=g.dataset.it.split(',').map(Number); g.classList.toggle('on', pins.length>0 && (it.length===1 ? pins.includes(it[0]) && pins.length===1 : [...it].sort((a,b)=>a-b).join()===key)); });
}
$('#side').addEventListener('mouseover',e=>{
  const li=e.target.closest('.ref li'); if(!li) return;
  refHi(li.closest('.ref'), li.dataset.pins.split(',').map(Number));
});
$('#side').addEventListener('mouseout',e=>{
  const li=e.target.closest('.ref li'); if(!li) return;
  const card=li.closest('.ref'), k=card.dataset.ref;
  const act=sel.slot && REF_OF[EL[sel.slot.id].comp]===k;
  if(act){ const ans=EL[sel.slot.id].ans; if(ans.length===3){ card.querySelectorAll('[data-p]').forEach(g=>g.classList.toggle('hl',ans.map(String).includes(g.dataset.p))); card.querySelectorAll('.it').forEach(g=>g.classList.toggle('on',ans.includes(+g.dataset.it) && !g.dataset.it.includes(','))); } else refHi(card,ans); }
  else refHi(card,[]);
});
$('#tools').addEventListener('click',e=>{
  const b=e.target.closest('[data-act]'); if(!b) return; const a=b.dataset.act;
  if (state.mode==='free'){ freeTool(a); return; }
  if (state.mode==='ext'){ extTool(a); return; }
  if (a==='check'){ state.checked=true; ST=computeStatus(); const bad=EL_IDS.find(id=>ST[id]!=='ok'); sel.slot=bad?{id:bad,i:0}:null; render(); }
  if (a==='answer'){ EL_IDS.forEach(id=>state.pins[id]=[...EL[id].ans]); state.checked=true; sel.slot=null; render(); }
  if (a==='clearpins'){ state.pins={}; state.checked=false; sel.slot=null; closeKeypad(); render(); }
  if (a==='next'){ const w=WIRES.find(x=>!wired.has(x.id)); sel.hint=w?w.id:null; sel.wire=null; render(); }
  if (a==='wireall'){ WIRES.forEach(w=>wired.add(w.id)); sel.hint=null; sel.wire=null; render(); }
  if (a==='clearwires'){ wired.clear(); sel.hint=null; sel.wire=null; render(); }
  if (a==='dnext'){ const d=DUCTS.find(x=>!ducted.has(x.id)); sel.dhint=d?d.id:null; sel.duct=null; render(); }
  if (a==='dall'){ DUCTS.forEach(d=>ducted.add(d.id)); sel.dhint=null; sel.duct=null; render(); }
  if (a==='dclear'){ ducted.clear(); sel.dhint=null; sel.duct=null; render(); }
});
document.querySelectorAll('.steps button').forEach(b=>b.addEventListener('click',()=>{ state.mode=b.dataset.mode; closeKeypad(); sel.wire=null; sel.hint=null; sel.duct=null; sel.dhint=null; Object.assign(freeSel,{pin:null,wire:null,net:null,msg:''}); FREE_HL=new Set(); Object.assign(extSel,{pin:null,wire:null,net:null,duct:null,msg:''}); tbSel.cell=null; render(); }));
function ductClick(id){ if(!ducted.has(id)){ ducted.add(id); sel.dfresh=id; if(sel.dhint===id) sel.dhint=null; sel.duct=id; } else sel.duct=(sel.duct===id?null:id); render(); }
$('#lay').addEventListener('click',e=>{ const g=e.target.closest('[data-duct]'); if(g) ductClick(g.dataset.duct); });
$('#resetAll').addEventListener('click',()=>ask('핀번호, 단자대 용도, 제어판 배선, 배관·단자대 배선을 모두 지우고 처음부터 시작할까요?','처음부터 다시 하기',()=>{
  state.pins={}; state.checked=false; wired.clear(); ducted.clear(); state.mode='pins'; state.free=[]; FRES=null; FREE_HL=new Set(); Object.assign(freeSel,{pin:null,wire:null,net:null,msg:''}); state.ext=[]; XRES=null; Object.assign(extSel,{pin:null,wire:null,net:null,duct:null,msg:''}); state.tbmap={}; tbSel.cell=null;
  Object.assign(sel,{slot:null,wire:null,hint:null,duct:null,dhint:null}); closeKeypad(); render();
},$('#resetAll')));
$('#probList').innerHTML=PROBLEMS.map(p=>`<button data-prob="${p.no}" aria-current="${p.no===CUR_PROB}"${p.variants.length?'':' disabled title="준비 중"'}><span class="pn">${p.no}</span><span class="pt">${p.short}</span></button>`).join('');
{ const p=PROBLEMS.find(x=>x.no===CUR_PROB);
  const base=p.no===1?0:9, vi=CUR_VAR-base;
